<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
<title>IMMAST × RISE — Course Calendar 2026–27</title>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="accelerometer=(), autoplay=(), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()">

<style>
:root{
  --bg: #FFFFFF;
  --bg-2: #F6F3EE;
  --paper: #FFFFFF;
  --ink: #2B2722;
  --ink-2: #585148;
  --ink-3: #8A8378;
  --line: #E7E2D7;
  --line-2: #C7BFB0;

  --accent: #F47A21;
  --accent-soft: #F7B27A;
  --accent-bg: #FCE8D4;

  --immast: #1F4F8F;
  --immast-soft: #8FA6C6;
  --immast-bg: #DEE6F2;

  --rise: #E0423B;
  --rise-soft: #F0A19D;
  --rise-bg: #FADDDB;

  --shadow-sm: 0 1px 2px rgba(43,39,34,0.04), 0 1px 3px rgba(43,39,34,0.06);
  --shadow-md: 0 2px 8px rgba(43,39,34,0.05), 0 8px 24px rgba(43,39,34,0.06);
  --shadow-lg: 0 10px 40px rgba(43,39,34,0.10), 0 20px 60px rgba(43,39,34,0.08);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  --topbar-h: 84px;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Hoefler Text", Georgia, "Times New Roman", serif;
}

.q-1{ --q-color: var(--accent); --q-soft: var(--accent-soft); --q-bg: var(--accent-bg); }
.q-2{ --q-color: var(--immast); --q-soft: var(--immast-soft); --q-bg: var(--immast-bg); }
.q-3{ --q-color: var(--rise); --q-soft: var(--rise-soft); --q-bg: var(--rise-bg); }

html{
  color-scheme: light only;
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
*{
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  font-synthesis: none;
  -webkit-font-synthesis: none;
}
em, i, address, cite, dfn, var{ font-style: normal; }
body{
  font-family: var(--font-sans);
  font-feature-settings: "kern" 1, "liga" 1;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  forced-color-adjust: none;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
input, textarea{ user-select: text; -webkit-user-select: text; font-size: 16px; }

.ambient{
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 18% 12%, rgba(244,122,33,0.035), transparent 60%),
    radial-gradient(ellipse 50% 40% at 86% 88%, rgba(31,79,143,0.035), transparent 60%);
}

.topbar{
  position: sticky; top: 0; z-index: 40;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: saturate(1.2) blur(12px);
  -webkit-backdrop-filter: saturate(1.2) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner{
  max-width: 1400px; margin: 0 auto;
  padding: 16px 32px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  min-height: 84px;
}
.topbar-nav{
  display: flex; align-items: center; gap: 4px;
  justify-self: start;
}
.nav-link{
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 200ms var(--ease);
  letter-spacing: -0.005em;
}
.nav-link:hover{ color: var(--ink); background: var(--bg-2); }
.nav-link.active{ background: var(--ink); color: var(--paper); }
.nav-link[disabled]{ color: var(--ink-3); cursor: not-allowed; }
.nav-link[disabled]:hover{ background: transparent; color: var(--ink-3); }

.burger{
  display: none;
  align-items: center; justify-content: center;
  width: 44px; height: 44px;
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 12px;
  cursor: pointer;
  color: var(--ink);
  transition: all 200ms var(--ease);
}
.burger:hover{ background: var(--bg-2); }
.burger svg{ width: 22px; height: 22px; }

.brand-group{
  display: flex; align-items: center; gap: 22px;
  justify-self: center;
}
body.screen-landing .brand-group,
body.screen-quarters .brand-group{ visibility: hidden; }
.brand-group img{ display: block; cursor: pointer; }
.logo-immast{ height: 64px; width: auto; }
.logo-rise{ height: 50px; width: auto; }
.logo-sun{ height: 72px; width: auto; opacity: 1; }
.brand-divider{
  width: 1px; height: 46px; background: var(--line-2);
}
.topbar-right{
  display: flex; align-items: center; gap: 16px;
  justify-self: end;
}

.mobile-drawer{
  position: absolute;
  top: 100%; left: 0; right: 0;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: saturate(1.2) blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px 16px;
  display: none;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow-md);
}
.mobile-drawer.open{ display: flex; }
.mobile-drawer .nav-link{
  text-align: left;
  padding: 12px 14px;
  font-size: 15px;
}

.back-slot{
  position: sticky;
  top: calc(var(--topbar-h) + 12px);
  z-index: 30;
  align-self: flex-start;
  width: 100%;
  text-align: left;
  pointer-events: none;
  margin-bottom: 20px;
}
.back-btn{
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid var(--line-2);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 9px 18px 9px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 220ms var(--ease);
  box-shadow: var(--shadow-md);
  pointer-events: auto;
}
.back-btn:hover{ background: var(--ink); color: var(--paper); border-color: var(--ink); transform: translateX(-2px); }
.back-btn svg{ width: 14px; height: 14px; }

.stage{
  position: relative; z-index: 1;
  flex: 1;
}
.screen{
  position: absolute;
  top: 0; left: 0; right: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms var(--ease), transform 420ms var(--ease);
  transform: translateY(14px);
  padding: 48px 32px 80px;
}
.screen.active{
  position: relative;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.screen.exit-left{ transform: translateX(-24px); }
.screen.exit-right{ transform: translateX(24px); }

.container{ max-width: 1280px; margin: 0 auto; width: 100%; }

.eyebrow{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
  font-weight: 500;
}
.eyebrow .dot{ width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }

.landing{
  display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
  text-align: center;
  min-height: calc(100vh - 84px - 128px);
  padding-top: clamp(24px, 4vw, 48px);
}
#screen-landing .landing{
  justify-content: center;
  padding-top: clamp(16px, 3vw, 40px);
  padding-bottom: clamp(32px, 6vw, 72px);
}
.landing-logos{
  display: flex; align-items: center; justify-content: center;
  gap: clamp(18px, 4vw, 64px);
  margin-bottom: clamp(32px, 5vw, 56px);
  flex-wrap: nowrap;
  max-width: 100%;
}
.landing-logos img{ display: block; height: auto; cursor: pointer; }
.landing-logo.immast{ height: clamp(82px, 28vw, 280px); }
.landing-logo.rise{ height: clamp(64px, 23vw, 232px); }
.landing-logos .lg-divider{
  width: 1px;
  height: clamp(60px, 20vw, 200px);
  background: var(--line-2);
  flex-shrink: 0;
}
.landing h1{
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(48px, 7.5vw, 104px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  color: var(--ink);
  max-width: 14ch;
  margin-bottom: 48px;
  text-wrap: balance;
}
.cta-primary{
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--ink);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  padding: 20px 32px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: all 260ms var(--ease);
  box-shadow: var(--shadow-md);
  margin-top: clamp(32px, 5vw, 56px);
}
.cta-primary:hover{ background: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.cta-primary:active{ transform: translateY(0); }
.cta-primary .arrow{
  width: 28px; height: 28px;
  border-radius: 999px;
  background: rgba(255,255,255,0.14);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 260ms var(--ease);
}
.cta-primary:hover .arrow{ transform: translateX(3px); }
.cta-primary svg{ width: 14px; height: 14px; }

.cal-badge{
  position: relative;
  width: clamp(200px, 22vw, 260px);
  margin: clamp(20px, 3vw, 36px) auto 0;
  filter: drop-shadow(0 10px 22px rgba(43,39,34,0.14));
}
.cal-rings{
  position: absolute;
  left: 0; right: 0;
  top: -12px;
  display: flex; justify-content: center;
  gap: clamp(18px, 2.6vw, 26px);
  pointer-events: none;
  z-index: 2;
}
.cal-rings span{
  display: block;
  width: 10px;
  height: 24px;
  background: linear-gradient(180deg, #4A4540 0%, #2B2722 100%);
  border-radius: 3px;
  box-shadow: inset 0 -2px 0 rgba(255,255,255,0.14), 0 1px 0 rgba(0,0,0,0.35);
}
.cal-top{
  position: relative;
  height: clamp(48px, 6vw, 62px);
  background: linear-gradient(90deg, #1F4F8F 0%, #1F4F8F 50%, #E0423B 50%, #E0423B 100%);
  border-radius: 10px 10px 0 0;
  display: flex; align-items: center; justify-content: center;
  color: #FFFFFF;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: clamp(15px, 1.45vw, 18px);
  letter-spacing: 0.22em;
}
.cal-bottom{
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-top: none;
  border-radius: 0 0 10px 10px;
  padding: clamp(12px, 1.6vw, 18px);
  text-align: center;
  color: #2B2722;
  font-family: var(--font-serif);
  font-size: clamp(22px, 2.2vw, 28px);
  font-weight: 500;
  letter-spacing: -0.005em;
}

.screen-header{
  text-align: center;
  margin-bottom: 56px;
}
.screen-header .eyebrow{ margin-bottom: 20px; }
.screen-header h2{
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(36px, 5vw, 64px);
  line-height: 1.04;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  text-wrap: balance;
}
.screen-header h2 .accent{ color: var(--accent); font-weight: 500; }
.screen-header p{
  color: var(--ink-2);
  font-size: 16px;
  max-width: 56ch;
  margin: 0 auto;
  line-height: 1.6;
}

.quarter-grid{
  display: flex;
  flex-wrap: wrap;
  gap: clamp(16px, 2.2vw, 28px);
  justify-content: center;
  max-width: 1120px;
  margin: clamp(32px, 5vw, 56px) auto 0;
}

.q-card{
  position: relative;
  display: inline-flex;
  align-items: stretch;
  padding: 0;
  height: clamp(72px, 7vw, 92px);
  background: #FFFFFF;
  border: 2px solid var(--q-color, var(--accent));
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--font-serif);
  color: var(--ink);
  box-shadow: 0 4px 14px rgba(43,39,34,0.08);
  transition: transform 260ms var(--ease), box-shadow 260ms var(--ease);
  padding-right: clamp(56px, 6vw, 72px);
}
.q-card:hover{ transform: translateY(-3px); box-shadow: 0 10px 28px rgba(43,39,34,0.14); }
.q-card:active{ transform: translateY(-1px); }

.q-card__label{
  padding: 0 clamp(24px, 2.6vw, 36px) 0 clamp(28px, 3vw, 40px);
  display: flex; align-items: center;
  font-size: clamp(22px, 2.2vw, 30px);
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink);
}

.q-card__hex{
  position: absolute;
  right: -2px; top: 50%;
  transform: translateY(-50%);
  width: clamp(78px, 8vw, 100px);
  height: clamp(84px, 9vw, 108px);
  background: var(--q-color, var(--accent));
  clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);
  display: flex; align-items: center; justify-content: center;
  color: #FFFFFF;
  font-size: clamp(32px, 3.4vw, 44px);
  font-weight: 600;
  letter-spacing: -0.01em;
  filter: drop-shadow(2px 3px 6px rgba(43,39,34,0.25));
}
.q-card__hex::after{
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 50% 96%, 92% 50%, 50% 4%);
  background: rgba(0,0,0,0.16);
  pointer-events: none;
}

.screen.active .q-card{
  animation: rise 500ms var(--ease) backwards;
}
.screen.active .q-card:nth-child(1){ animation-delay: 60ms; }
.screen.active .q-card:nth-child(2){ animation-delay: 140ms; }
.screen.active .q-card:nth-child(3){ animation-delay: 220ms; }

@keyframes rise{
  from{ opacity: 0; transform: translateY(20px); }
  to{ opacity: 1; transform: translateY(0); }
}

.quarter-switch{
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
  padding: 10px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.qs-btn{
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent;
  border: none;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 220ms var(--ease);
  max-width: 45%;
  text-align: left;
}
.qs-btn:hover:not([disabled]){ background: var(--bg-2); }
.qs-btn[disabled]{ color: var(--ink-3); cursor: not-allowed; opacity: 0.5; }
.qs-btn svg{ width: 14px; height: 14px; flex-shrink: 0; }
.qs-btn .qs-meta{
  display: flex; flex-direction: column; gap: 1px;
  min-width: 0;
}
.qs-btn .qs-meta .qs-label{
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500;
}
.qs-btn .qs-meta .qs-title{
  font-family: var(--font-serif); font-size: 15px; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qs-btn.next{ text-align: right; flex-direction: row-reverse; }
.qs-spacer{
  max-width: 45%;
  flex: 1 1 0;
  visibility: hidden;
}
.qs-current{
  font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500;
  padding: 0 8px;
}
.qs-current strong{
  color: var(--ink); font-weight: 600;
}

.course-header{
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.course-header-left h2{
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(36px, 4.4vw, 56px);
  letter-spacing: -0.02em;
  line-height: 1.02;
  margin-bottom: 10px;
}
.course-header-left h2 .accent{ color: var(--q-color, var(--accent)); font-weight: 500; }
.course-header-left .sub{
  color: var(--ink-2);
  font-size: 15px;
}
.course-header-right{
  display: flex; gap: 10px;
  flex-wrap: wrap;
}
.specialty-chip{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: var(--q-bg, var(--accent-bg));
  border: 1px solid var(--q-soft, var(--accent-soft));
  color: var(--q-color, var(--accent));
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
}
.specialty-chip .tick{
  width: 5px; height: 5px; border-radius: 999px; background: currentColor;
}

.course-list{
  display: flex; flex-direction: column;
  gap: 12px;
}
.course-row{
  display: grid;
  grid-template-columns: 56px 1fr 220px 120px 56px;
  align-items: center;
  gap: 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 20px 24px;
  cursor: pointer;
  transition: all 240ms var(--ease);
  font-family: inherit;
  text-align: left;
  color: var(--ink);
  width: 100%;
  position: relative;
}
.course-row::before{
  content: "";
  position: absolute;
  left: 0; top: 20px; bottom: 20px;
  width: 2px;
  background: var(--q-color, var(--accent));
  border-radius: 2px;
  opacity: 0;
  transition: opacity 240ms var(--ease);
}
.course-row:hover{ border-color: var(--line-2); transform: translateX(4px); box-shadow: var(--shadow-md); }
.course-row:hover::before{ opacity: 1; }

.course-idx{
  font-family: var(--font-serif);
  font-size: 22px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.course-name{
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.course-name small{
  display: block;
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
  margin-bottom: 6px;
}
.course-dates{
  font-size: 14px;
  color: var(--ink-2);
  display: flex; flex-direction: column; gap: 2px;
}
.course-dates .label{
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500;
}
.course-batch{
  display: flex; flex-direction: column; gap: 2px;
  font-size: 14px;
  color: var(--ink-2);
}
.course-batch .label{
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500;
}
.course-batch .val{
  font-family: var(--font-serif);
  font-size: 22px;
  color: var(--ink);
}
.course-open{
  width: 44px; height: 44px;
  border-radius: 999px;
  background: var(--bg-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-2);
  transition: all 240ms var(--ease);
}
.course-row:hover .course-open{
  background: var(--q-color, var(--accent));
  color: white;
}
.course-row:hover .course-open svg{ transform: translate(2px, -2px); }
.course-open svg{ width: 16px; height: 16px; transition: transform 240ms var(--ease); }

.screen.active .course-row{
  animation: rise 420ms var(--ease) backwards;
}
.screen.active .course-row:nth-child(1){ animation-delay: 40ms; }
.screen.active .course-row:nth-child(2){ animation-delay: 100ms; }
.screen.active .course-row:nth-child(3){ animation-delay: 160ms; }
.screen.active .course-row:nth-child(4){ animation-delay: 220ms; }
.screen.active .course-row:nth-child(5){ animation-delay: 280ms; }

.site-foot{
  position: relative; z-index: 1;
  border-top: 1px solid var(--line);
  padding: 28px 32px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 24px; flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-3);
  max-width: 1400px; margin: 0 auto;
}

@media (max-width: 1024px){
  .quarter-grid{ gap: 16px; }
  .course-row{ grid-template-columns: 40px 1fr 180px 100px 44px; gap: 18px; padding: 18px 20px; }
  .course-name{ font-size: 18px; }
  .topbar-inner{ padding: 12px 24px; }
  .screen{ padding: 40px 24px 64px; }
}
@media (max-width: 820px){
  :root{ --topbar-h: 72px; }
  .topbar-inner{
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    padding: 12px 18px;
    min-height: 72px;
  }
  .topbar-nav{ display: none; }
  .burger{ display: inline-flex; justify-self: start; }
  .brand-group{ gap: 14px; }
  .logo-immast{ height: 48px; }
  .logo-rise{ height: 38px; }
  .logo-sun{ height: 54px; }
  .brand-divider{ height: 36px; }

  .quarter-switch{ flex-wrap: wrap; padding: 8px; gap: 6px; border-radius: 14px; }
  .qs-btn{ max-width: 100%; flex: 1; padding: 8px 10px; }
  .qs-current{ flex-basis: 100%; text-align: center; order: -1; padding: 4px 0; }

  .q-card{ height: 76px; padding-right: 60px; }
  .q-card__label{ font-size: 22px; padding: 0 22px 0 26px; }
  .q-card__hex{ width: 82px; height: 88px; font-size: 32px; }

  .course-row{
    grid-template-columns: 28px 1fr 44px;
    grid-template-rows: auto auto;
    gap: 4px 16px;
  }
  .course-idx{ grid-row: 1; grid-column: 1; font-size: 18px; }
  .course-name{ grid-row: 1; grid-column: 2; font-size: 17px; }
  .course-dates{ grid-column: 2; grid-row: 2; flex-direction: row; align-items: baseline; gap: 12px; }
  .course-batch{ display: none; }
  .course-open{ grid-row: 1 / span 2; grid-column: 3; align-self: center; }

  .course-header{ flex-direction: column; align-items: flex-start; }

  .site-foot{ flex-direction: column; align-items: flex-start; }
}
@media (max-width: 600px){
  .quarter-grid{ flex-direction: column; align-items: center; gap: 14px; max-width: 540px; margin-left: auto; margin-right: auto; }
  .q-card{ width: 100%; max-width: 360px; }
}
@media (max-width: 520px){
  :root{ --topbar-h: 68px; }
  .topbar-inner{ padding: 10px 14px; min-height: 68px; }
  .brand-group{ gap: 10px; }
  .logo-immast{ height: 40px; }
  .logo-rise{ height: 32px; }
  .logo-sun{ height: 46px; }
  .brand-divider{ height: 30px; }
  .burger{ width: 40px; height: 40px; }
  .burger svg{ width: 20px; height: 20px; }
  .screen{ padding: 28px 18px 56px; }
  .course-row{ padding: 14px 16px; gap: 2px 12px; }
}
@media (max-width: 380px){
  .logo-immast{ height: 34px; }
  .logo-rise{ height: 26px; }
  .logo-sun{ height: 38px; }
  .brand-divider{ height: 24px; }
  .brand-group{ gap: 8px; }
}

.sr-only{ position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>

<div class="ambient" aria-hidden="true"></div>

    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">

    </button>

    <div class="brand-group">
      <img class="logo-immast" src="assets/IMMAST Logo.png" alt="IMMAST — Institute of Medical and Minimal Access Surgery Training" />
      <div class="brand-divider" aria-hidden="true"></div>
      <img class="logo-rise" src="assets/Rise Logo.png" alt="RISE — Rozavel Initiative on Skill Enhancement" />

    <div class="topbar-right">
      <img class="logo-sun" src="assets/Sun Logo.png" alt="Sun Pharma" />

  </div>

    <button class="nav-link" data-nav="landing">Home</button>
    <button class="nav-link" data-nav="quarters">Quarter</button>
    <button class="nav-link" data-nav="courses">Courses</button>
  </nav>
</header>

<main class="stage" id="stage">

  <section class="screen active" id="screen-landing" data-screen="landing">
    <div class="container landing">
      <div class="landing-logos" aria-hidden="true">
        <img class="landing-logo immast" src="assets/IMMAST Logo.png" alt="" />
        <span class="lg-divider"></span>
        <img class="landing-logo rise" src="assets/Rise Logo.png" alt="" />
      </div>

      <div class="cal-badge" aria-label="Calendar 2026-27">
        <div class="cal-rings" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="cal-top">CALENDAR</div>
        <div class="cal-bottom">2026-27</div>
      </div>

      <button class="cta-primary" id="go-quarters">
        Explore courses
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>
  </section>

  <section class="screen" id="screen-quarters" data-screen="quarters">
    <div class="container landing">
      <div class="back-slot" id="backslot-quarters"></div>

      <div class="landing-logos" aria-hidden="true">
        <img class="landing-logo immast" src="assets/IMMAST Logo.png" alt="" />
        <span class="lg-divider"></span>
        <img class="landing-logo rise" src="assets/Rise Logo.png" alt="" />
      </div>

      <div class="cal-badge" aria-label="Calendar 2026-27">
        <div class="cal-rings" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="cal-top">CALENDAR</div>
        <div class="cal-bottom">2026-27</div>
      </div>

      <div class="quarter-grid" id="quarter-grid"></div>
    </div>
  </section>

  <section class="screen" id="screen-courses" data-screen="courses">
    <div class="container">
      <div class="back-slot" id="backslot-courses"></div>
      <div class="quarter-switch" id="quarter-switch"></div>
      <div class="course-header" id="course-header"></div>
      <div class="course-list" id="course-list"></div>
    </div>
  </section>

</main>

<footer class="site-foot">
  <div>© 2026 IMMAST — Institute of Medical and Minimal Access Surgery Training</div>
  <div>RISE · Rozavel Initiative on Skill Enhancement · Sun Pharma</div>
</footer>

<script src="script.js" integrity="sha384-A+Ct6dbJ8FGeuEeyg1Lf+o1vy4goAuiJLWhJfZBiBYqi0Lax/h2ip8LG7iopjPua" defer></script>
