<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
<title>IMMAST × RISE — Course Calendar 2026–27</title>

<!-- Security headers (meta equivalents — configure matching response headers at the web server for full effect) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="accelerometer=(), autoplay=(), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<!-- ========== TOP BAR ========== -->
<header class="topbar" role="banner">
  <div class="topbar-inner">
    <nav class="topbar-nav" aria-label="Primary">
      <button class="nav-link" data-nav="landing">Home</button>
      <button class="nav-link" data-nav="quarters">Quarter</button>
      <button class="nav-link" data-nav="courses">Courses</button>
    </nav>

    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="brand-group">
      <img class="logo-immast" src="assets/IMMAST Logo.png" alt="IMMAST — Institute of Medical and Minimal Access Surgery Training" />
      <div class="brand-divider" aria-hidden="true"></div>
      <img class="logo-rise" src="assets/Rise Logo.png" alt="RISE — Rozavel Initiative on Skill Enhancement" />
    </div>

    <div class="topbar-right">
      <img class="logo-sun" src="assets/Sun Logo.png" alt="Sun Pharma" />
    </div>
  </div>

  <nav class="mobile-drawer" id="mobile-drawer" aria-label="Mobile primary">
    <button class="nav-link" data-nav="landing">Home</button>
    <button class="nav-link" data-nav="quarters">Quarter</button>
    <button class="nav-link" data-nav="courses">Courses</button>
  </nav>
</header>

<!-- ========== STAGE ========== -->
<main class="stage" id="stage">

  <!-- Screen 1: Landing -->
  <section class="screen active" id="screen-landing" data-screen="landing">
    <div class="container landing">
      <div class="landing-logos" aria-hidden="true">
        <img class="landing-logo immast" src="assets/IMMAST Logo.png" alt="" />
        <span class="lg-divider"></span>
        <img class="landing-logo rise" src="assets/Rise Logo.png" alt="" />
      </div>

      <div class="cal-badge" aria-label="Calendar 2026-27">
        <div class="cal-rings" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="cal-top">CALENDAR</div>
        <div class="cal-bottom">2026-27</div>
      </div>

      <button class="cta-primary" id="go-quarters">
        Explore courses
        <span class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>
  </section>

  <!-- Screen 2: Quarter select -->
  <section class="screen" id="screen-quarters" data-screen="quarters">
    <div class="container landing">
      <div class="back-slot" id="backslot-quarters"></div>

      <div class="landing-logos" aria-hidden="true">
        <img class="landing-logo immast" src="assets/IMMAST Logo.png" alt="" />
        <span class="lg-divider"></span>
        <img class="landing-logo rise" src="assets/Rise Logo.png" alt="" />
      </div>

      <div class="cal-badge" aria-label="Calendar 2026-27">
        <div class="cal-rings" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="cal-top">CALENDAR</div>
        <div class="cal-bottom">2026-27</div>
      </div>

      <div class="quarter-grid" id="quarter-grid"></div>
    </div>
  </section>

  <!-- Screen 3: Course list -->
  <section class="screen" id="screen-courses" data-screen="courses">
    <div class="container">
      <div class="back-slot" id="backslot-courses"></div>
      <div class="quarter-switch" id="quarter-switch"></div>
      <div class="course-header" id="course-header"></div>
      <div class="course-list" id="course-list"></div>
    </div>
  </section>

</main>

<!-- ========== FOOTER ========== -->
<footer class="site-foot">
  <div>© 2026 IMMAST — Institute of Medical and Minimal Access Surgery Training</div>
  <div>RISE · Rozavel Initiative on Skill Enhancement · Sun Pharma</div>
</footer>

<!-- ========== PDF VIEWER ========== -->
<div class="pdf-overlay" id="pdf-overlay" role="dialog" aria-modal="true" aria-label="Course brochure">
  <div class="pdf-topbar">
    <div class="pdf-title">
      <span class="top">Course brochure</span>
      <span class="name" id="pdf-name">—</span>
    </div>
    <div class="pdf-controls">
      <a class="pdf-open-new" id="pdf-open-new" href="#" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M10 14L21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        Open in new tab
      </a>
      <button class="pdf-btn" id="pdf-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="pdf-stage" id="pdf-stage">
    <div class="pdf-canvas" id="pdf-canvas">
      <iframe class="pdf-frame" id="pdf-frame" title="Course brochure" src="about:blank"></iframe>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
